name: Build fork image

on:
  push:
    branches:
      - feature/activity-objects
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/omarahmed-cell/twenty

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read app version
        id: version
        run: |
          version=$(sed -nE "s/^export const TWENTY_CURRENT_VERSION = '([^']+)'.*/\1/p" packages/twenty-server/src/engine/core-modules/upgrade/constants/twenty-current-version.constant.ts)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            --target twenty \
            --platform linux/amd64 \
            --build-arg APP_VERSION=${{ steps.version.outputs.value }} \
            --label org.opencontainers.image.source=https://github.com/omarahmed-cell/twenty \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f packages/twenty-docker/twenty/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          df -h /

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
